name: Sync Latest Radar Events & Guides

on:
  schedule:
    # Run once daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync Radar Feeds
        run: |
          python - << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import os

          feeds = [
              ("Events", "https://thingstodoradar.com/feeds/events.xml"),
              ("Guides", "https://thingstodoradar.com/feeds/guides.xml")
          ]

          dispatches = []
          for feed_name, url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Radar-GitHub-Sync-Bot/1.0"})
                  resp = urllib.request.urlopen(req, timeout=15)
                  root = ET.fromstring(resp.read())
                  for item in root.findall(".//item")[:10]:
                      title = item.findtext("title")
                      link = item.findtext("link")
                      pub_date = item.findtext("pubDate")
                      description = item.findtext("description")
                      if title and link:
                          dispatches.append({
                              "channel": feed_name,
                              "title": title.strip(),
                              "link": link.strip(),
                              "pub_date": pub_date.strip() if pub_date else "",
                              "description": description.strip() if description else ""
                          })
              except Exception as e:
                  print(f"Error fetching {feed_name}: {e}")

          os.makedirs("data", exist_ok=True)
          with open("data/latest_dispatches.json", "w", encoding="utf-8") as f:
              json.dump(dispatches, f, indent=2, ensure_ascii=False)
          print(f"Synced {len(dispatches)} active dispatches!")
          EOF

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_dispatches.json
          if git diff --staged --quiet; then
            echo "No feed changes detected. Everything up to date."
          else
            git commit -m "chore: sync latest radar editorial dispatches [automated]"
            git push
          fi
